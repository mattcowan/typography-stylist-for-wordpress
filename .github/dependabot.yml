# Dependabot: weekly version updates and grouped security updates (#257).
#
# Everything here is a build or test tool. Nothing from node_modules/ or
# vendor/ ships (.distignore), so these updates change CI and developer
# machines, not sites that run the plugin. The vendored runtime libraries in
# glyphs-panel/assets/js/vendor/ have no manifest; update them by hand
# (BUILD.txt).
#
# A dependency joins the first group whose patterns it matches. Each
# ecosystem has a security-updates group, so its security updates come as
# one pull request. Those pull requests need the repository setting
# "Dependabot security updates"; this file cannot turn it on.
#
# npm major version updates are ignored: Babel 8 (babelify 10 needs
# @babel/core 7) and React 19 (WordPress ships React 18.3, so react,
# react-dom and react-test-renderer stay at 18) need work by hand. This
# ignore rule did not stop a major version in a security update: #266
# raised @wordpress/scripts from 31 to 36 in the npm-security group.
#
# Nothing merges automatically: every pull request runs the CI workflow and
# waits for review.
#
# Each ecosystem has a 7-day cooldown: a version update is offered only when
# the version is at least 7 days old. A hijacked release is usually found and
# removed from the registry within days, and a broken release is usually
# replaced by a fix in the same time. Security updates ignore the cooldown.
# GitHub's documentation does not say whether the cooldown also applies to a
# new transitive dependency that an update adds.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      wordpress:
        patterns: ["@wordpress/*"]
      babel:
        patterns: ["@babel/*", "babelify"]
      testing:
        patterns:
          - "@playwright/*"
          - "@testing-library/*"
          - "@guidepup/*"
          - "react-test-renderer"
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # composer.json sets config.platform.php to 7.4, and Composer resolves
  # updates against it, so a version that needs a newer PHP is not offered.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      composer-security:
        applies-to: security-updates
        patterns: ["*"]
      composer-dev:
        patterns: ["*"]

  # Dependabot updates version tags and commit SHAs only, so the two
  # 10up/*@stable branch references in the workflows are not updated.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions:
        patterns: ["*"]
