# Runs a Claude review on a pull request only when the repo owner writes
# "@claude review" in a PR comment, review comment or review body (#271).
# Nothing runs on push or when a PR opens, so it only uses Claude plan usage
# and Actions minutes when asked. Claude can read the repo and comment on the
# PR, but it cannot commit or push (see the action inputs below).
#
# contains() ignores case and matches a substring, so "@Claude Review" and
# "@claude reviewed" also start a run. "@claude" alone does not.
#
# On a PR from a fork, ask for a review in a PR comment only (#306). GitHub
# gives pull_request_review_comment and pull_request_review runs from a fork
# no secrets and a read-only GITHUB_TOKEN, so a request in a review comment
# or a review body fails to authenticate. issue_comment runs in this
# repository, so a PR comment works. Do not add a second workflow that holds
# credentials for the fork events: the PR comment already covers that case.
#
# GitHub runs issue_comment workflows only from the default branch, and the
# app token exchange rejects a workflow that differs from it. So
# "@claude review" does nothing on the PR that adds or changes this file
# until it is merged.
#
# Needs the CLAUDE_CODE_OAUTH_TOKEN repo secret, created with
# `claude setup-token` (works on Pro and Max), and the Claude GitHub app
# installed on the repo. Do not set this up with Claude Code's
# /install-github-app: it also opens a PR with an automatic review workflow.
#
# Both actions are pinned to a commit SHA, because a tag such as @v1 can be
# moved and the job holds a token with write access to PRs and issues.
# To update, resolve the new tag to its commit SHA (claude-code-action tags
# are annotated, so resolve the tag object to its commit) and change the
# comment.
name: Claude review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude review') &&
        github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude review') &&
        github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude review') &&
        github.event.review.author_association == 'OWNER')
    # One run per PR at a time. A review whose body and N inline comments all
    # ask for a review fires N+1 events; GitHub keeps one running and only the
    # newest pending, and cancels the rest. Job level, not workflow level, so
    # a comment that skips the job cannot cancel a queued run.
    concurrency:
      group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Read-only. The action swaps the OIDC token for a Claude app token
          # with contents: write by default, and on an open PR it pushes to the
          # PR branch. This lowers the app token to contents: read (merged over
          # the defaults), so a push fails whatever Claude tries.
          additional_permissions: |
            contents: read
          # And stop Claude from trying: block the commit and push tools of both
          # commit paths (git CLI by default, the file-ops tools with commit
          # signing). The action pushes through its own wrapper at
          # $GITHUB_ACTION_PATH/scripts/git-push.sh, which "git push" does not
          # match, so the wrapper gets its own rule; "*" may appear anywhere in
          # a Bash rule, and deny rules win over the action's allow list.
          claude_args: >-
            --disallowedTools
            "Bash(git commit:*),Bash(git push:*),Bash(*scripts/git-push.sh*),Bash(git rm:*),mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
