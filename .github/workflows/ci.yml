# CI: tests + build verification on every push and pull request, and the
# e2e suite in wp-env on pull requests to main (#373).
#
# The "build" job also proves that the gitignored production artifacts
# (minified JS/CSS, blocks/typography-stylist/build/) can be produced from a
# clean checkout — the release workflow depends on that.
#
# Run this workflow manually (Actions → CI → Run workflow) to get an
# installable plugin zip as a build artifact — the on-demand substitute for
# nightly builds. See RELEASING.md § On-demand builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  js-tests:
    name: JavaScript tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # @wordpress/scripts 36 needs ^22.22.2 || ^24.15.0 || >=26 (#256).
          node-version: 24
          cache: npm
      - run: npm ci
      # Fail on critical advisories in the dev dependencies (#256). Not
      # "high" yet: braces GHSA-vfj7-8cjw-p6xm has no patched version, and
      # @wordpress/scripts needs it through micromatch.
      - run: npm audit --audit-level=critical
      - run: npm test

  php-tests:
    name: PHP tests (PHPUnit / Brain Monkey)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      # The GREP styles engine (#196) runs on WordPress's HTML API, and its
      # tests use the real parser: fetch just wp-includes/html-api and the
      # token map from WordPress 6.9 (the first release with a public
      # serialize_token()). Without TYPOST_WP_DIR those tests are skipped.
      - name: Fetch the WordPress HTML API
        run: |
          git clone --depth 1 --branch 6.9 --filter=blob:none --sparse https://github.com/WordPress/WordPress.git "$RUNNER_TEMP/wordpress"
          git -C "$RUNNER_TEMP/wordpress" sparse-checkout set --no-cone /wp-includes/html-api/ /wp-includes/class-wp-token-map.php
          echo "TYPOST_WP_DIR=$RUNNER_TEMP/wordpress" >> "$GITHUB_ENV"
      - run: vendor/bin/phpunit

  build:
    name: Version check + production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: the module version check on release/*
          # PRs compares with the previous stable tag, and the default
          # shallow checkout has no tags (#287).
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The six version sources (plugin header, TYPOST_VERSION, readme
      # Stable tag, package.json, and the two package-lock.json versions)
      # must always agree — fail fast if not.
      - run: node scripts/check-versions.js
      # On a release PR, also fail when a bundled module's assets/ changed
      # since the previous stable tag but its version constant did not —
      # before the GitHub Release is published. The deploy runs the same
      # check again in tag mode.
      - name: Module version check (release PRs)
        if: startsWith(github.head_ref, 'release/')
        run: node scripts/check-versions.js --modules
      - run: npm run build
      # On manual runs, also package an installable zip and attach it as an
      # artifact (kept 7 days) — grab a test build from any branch on demand.
      - name: Package on-demand zip
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/package.js
      - name: Upload zip artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: typography-stylist-${{ github.sha }}
          path: typography-stylist.zip
          retention-days: 7

  # The Playwright suite (tests/e2e) in wp-env on the stable WordPress, so a
  # pull request cannot merge with a broken editor (#373). The same suite
  # runs weekly on WordPress trunk in compat.yml.
  #
  # Pull requests to main only (and pushes to main, and manual runs): a
  # stacked pull request into another branch runs it when it reaches main.
  # A skipped job reports success, so this is safe as a required check.
  #
  # It needs no secret and only a read-only token, so it runs the same way
  # for Dependabot and for pull requests from forks.
  #
  # Supply chain: @wordpress/env is not a dev dependency, so it is installed
  # here at one pinned version (its own dependencies are resolved at install
  # time, as in compat.yml). This job does not use the npm Actions cache, so
  # nothing it installs is saved for the jobs that restore it.
  e2e:
    name: E2E (stable WordPress)
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      # wp-env's default site and admin user, not a local development site.
      WP_BASE_URL: http://localhost:8888
      WP_USERNAME: admin
      WP_PASSWORD: password
    steps:
      # No later step needs git, so the token is not kept in the checkout
      # while the job installs packages and runs the pull request's code.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The bundles are gitignored, and the editor is broken without them.
      - run: npm ci
      - run: npm run build
      # .wp-env.json: the WordPress release wp-env installs by default (the
      # latest stable), PHP 8.2, this checkout as the plugin.
      - run: npm install -g --no-audit --no-fund @wordpress/env@12.0.0
      - run: wp-env start
      - name: WordPress and plugin versions
        run: |
          wp-env run cli wp core version -- --extra
          wp-env run cli wp plugin list
      - run: npx playwright install --with-deps chromium firefox
      # A step timeout, under the job's, fails the step instead of cancelling
      # the job, so the report and the logs below are still collected.
      - run: npx playwright test
        timeout-minutes: 30
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: wp-env logs
        if: failure()
        run: wp-env logs --watch=false
