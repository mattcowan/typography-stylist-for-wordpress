# CI: tests + build verification on every push and pull request.
#
# The "build" job also proves that the gitignored production artifacts
# (minified JS/CSS, blocks/typography-stylist/build/) can be produced from a
# clean checkout — the release workflow depends on that.
#
# Run this workflow manually (Actions → CI → Run workflow) to get an
# installable plugin zip as a build artifact — the on-demand substitute for
# nightly builds. See RELEASING.md § On-demand builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  js-tests:
    name: JavaScript tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # @wordpress/scripts 36 needs ^22.22.2 || ^24.15.0 || >=26 (#256).
          node-version: 24
          cache: npm
      - run: npm ci
      # Fail on critical advisories in the dev dependencies (#256). Not
      # "high" yet: braces GHSA-vfj7-8cjw-p6xm has no patched version, and
      # @wordpress/scripts needs it through micromatch.
      - run: npm audit --audit-level=critical
      - run: npm test

  php-tests:
    name: PHP tests (PHPUnit / Brain Monkey)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit

  build:
    name: Version check + production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The six version sources (plugin header, TYPOST_VERSION, readme
      # Stable tag, package.json, and the two package-lock.json versions)
      # must always agree — fail fast if not.
      - run: node scripts/check-versions.js
      - run: npm run build
      # On manual runs, also package an installable zip and attach it as an
      # artifact (kept 7 days) — grab a test build from any branch on demand.
      - name: Package on-demand zip
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/package.js
      - name: Upload zip artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: typography-stylist-${{ github.sha }}
          path: typography-stylist.zip
          retention-days: 7
